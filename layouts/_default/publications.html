{{ define "main" }}
<style>
  .publications-layout {
    margin-top: 2rem;
  }

  .publications-list {
    min-width: 0;
  }

    .publications-list h2 {
      margin: 0 0 1.25rem;
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.3;
  }

  .publication-entry+.publication-entry {
    margin-top: 1.75rem;
  }

  .publication-entry__title {
    font-size: 1.05rem;
    font-weight: 700;
    line-height: 1.4;
  }

  .publication-entry__link {
    color: rgb(var(--color-primary-600));
    font-size: 0.95rem;
    text-decoration: underline;
    text-underline-offset: 0.15em;
  }

  .publication-entry__link:hover {
    color: rgb(var(--color-primary-700));
  }

  .dark .publication-entry__link {
    color: rgb(var(--color-primary-400));
  }

  .publication-entry__authors,
  .publication-entry__venue {
    margin-top: 0.15rem;
    line-height: 1.45;
  }

  .publication-entry__venue {
    font-weight: 400;
  }

  @media (max-width: 767px) {
    .publications-layout {
      margin-top: 1.5rem;
    }
  }
</style>

<div class="publications-layout">
  <section class="publications-list">
      <h2>{{ .Title }}</h2>

    {{ range .Params.publications }}
    <article class="publication-entry">
      <span class="publication-entry__title">{{ .title }}</span>
      <a class="publication-entry__link" href="{{ .url | safeURL }}" target="_blank" rel="noopener noreferrer">
        [{{ .linkLabel | default "paper" }}]
      </a>
      <div class="publication-entry__authors">{{ .authors }}</div>
      <div class="publication-entry__venue">{{ .venue }}</div>
    </article>
    {{ end }}
  </section>
</div>
{{ end }}
